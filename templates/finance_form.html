{{define "finance_form.html"}}

{{template "admin_layout" .}}

{{end}}

{{define "content"}}

<div class="container mt-4">

    <h2>{{.Title}}</h2>

    <form method="POST" action="/finance/create">

        <div class="mb-3">
            <label class="form-label">Transaction Type</label>

            <select
                name="type"
                class="form-control"
                required>

                <option value="">Select</option>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>

            <input
                type="text"
                name="category"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Amount</label>

            <input
                type="number"
                step="0.01"
                name="amount"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Recorded By</label>

            <input
                type="text"
                name="recorded_by"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>

            <input
                type="date"
                name="date"
                class="form-control"
                required>
        </div>

        <button
            class="btn btn-primary">
            Save Transaction
        </button>

        <a
            href="/finance"
            class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{{end}}
