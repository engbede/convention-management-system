{{define "create_post"}}

<div class="card shadow-sm border-0 rounded-4 mb-4">

    <div class="card-body">

        <div class="d-flex align-items-center mb-3">

            <div
                class="rounded-circle bg-success text-white d-flex justify-content-center align-items-center me-3"
                style="width:50px;height:50px;font-size:22px;font-weight:bold;">

                Y

            </div>

            <div>

                <h6 class="mb-0 fw-bold">

                    Youth Community

                </h6>

                <small class="text-muted">

                    Share encouragement, testimonies and announcements

                </small>

            </div>

        </div>

        <form
            id="createPostForm"
            action="/community/post"
            method="POST"
            enctype="multipart/form-data">

            <div id="postErrorAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3" role="alert">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                        <span id="postErrorText"></span>
                    </div>
                    <button type="button" class="btn-close small ms-2" aria-label="Close" onclick="document.getElementById('postErrorAlert').classList.add('d-none')"></button>
                </div>
            </div>

            <textarea
                class="form-control border-0 shadow-none fs-5"
                rows="4"
                name="content"
                maxlength="3000"
                placeholder="What's on your mind? Share an encouragement, testimony, prayer or announcement..."></textarea>

            <div class="text-end mt-1">

                <small
                    id="charCount"
                    class="text-muted">

                    0 / 3000

                </small>

            </div>

            <div
                id="previewArea"
                class="mt-3">

            </div>

            <div id="postUploadProgressContainer" class="d-none mt-2 mb-2 p-2 border rounded-3 bg-light">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span id="postProgressStatus" class="small fw-semibold text-secondary">Uploading media...</span>
                    <div class="d-flex align-items-center gap-2">
                        <span id="postProgressPercent" class="small fw-bold text-success">0%</span>
                        <button type="button" id="postCancelUploadBtn" class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size: 0.75rem;" title="Cancel upload">Cancel</button>
                    </div>
                </div>
                <div class="progress" style="height: 6px;">
                    <div id="postProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

            <hr>

            <div class="row g-2 align-items-center">

                <div class="col-md">

                    <label
                        class="btn btn-outline-success w-100">

                        📷 Photo

                        <input
                            id="imageInput"
                            type="file"
                            name="image"
                            accept="image/*"
                            hidden>

                    </label>

                </div>

                <div class="col-md">

                    <label
                        class="btn btn-outline-primary w-100">

                        🎥 Video

                        <input
                            id="videoInput"
                            type="file"
                            name="video"
                            accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov,.mkv,.avi"
                            hidden>

                    </label>

                </div>

                <div class="col-md">

                    <button
                        type="button"
                        class="btn btn-outline-warning w-100">

                        😀 Emoji

                    </button>

                </div>

                <div class="col-md">

                    <select
                        class="form-select"
                        name="visibility">

                        <option value="public">

                            🌍 Public

                        </option>

                        <option value="members">

                            👥 Members

                        </option>

                        <option value="private">

                            🔒 Private

                        </option>

                    </select>

                </div>

            </div>

            <hr>

            <div class="text-end">

                <button
                    id="submitPostBtn"
                    type="submit"
                    class="btn btn-success px-4">

                    <span id="submitPostSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status" aria-hidden="true"></span>

                    <span id="submitPostIcon"><i class="bi bi-send-fill"></i></span>

                    <span id="submitPostText" class="ms-1">Post</span>

                </button>

            </div>

        </form>

    </div>

</div>

{{end}}
