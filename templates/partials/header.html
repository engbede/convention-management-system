{{define "header"}}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Youth Community</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{

            background:#f0f2f5;

            font-family:'Inter',sans-serif;

            margin:0;

            padding:0;

        }

        .navbar{

            box-shadow:0 2px 10px rgba(0,0,0,.08);

        }

        .navbar-brand{

            font-size:1.3rem;

            font-weight:700;

        }

        .search-box{

            width:400px;

            border-radius:50px;

        }

        .sidebar-card{

            background:#fff;

            border:none;

            border-radius:12px;

            box-shadow:0 2px 8px rgba(0,0,0,.06);

        }

        .feed-card{

            background:#fff;

            border:none;

            border-radius:12px;

            box-shadow:0 2px 8px rgba(0,0,0,.08);

        }

        .avatar{

            width:52px;

            height:52px;

            border-radius:50%;

            background:#198754;

            color:white;

            display:flex;

            justify-content:center;

            align-items:center;

            font-weight:bold;

            font-size:20px;

        }

        textarea{

            resize:none;

        }

        .action-btn{

            border:none;

            background:white;

            border-radius:8px;

            transition:.25s;

            width:100%;

            padding:10px;

            font-weight:500;

        }

        .action-btn:hover{

            background:#f1f3f5;

        }

        .emoji button{

            border:none;

            background:none;

            font-size:22px;

            margin-right:5px;

        }

        .emoji button:hover{

            transform:scale(1.25);

        }

        .post-content{

            font-size:17px;

            line-height:1.6;

        }

        .profile-name{

            font-weight:600;

            font-size:18px;

        }

        .profile-username{

            color:gray;

            font-size:14px;

        }

        .time{

            color:#888;

            font-size:13px;

        }

        .create-post textarea{

            border:none;

            background:#f7f7f7;

        }

        .create-post textarea:focus{

            box-shadow:none;

            background:#fff;

        }

        .left-menu a{

            display:block;

            text-decoration:none;

            color:#222;

            padding:10px;

            border-radius:8px;

            margin-bottom:5px;

        }

        .left-menu a:hover{

            background:#f0f2f5;

        }

        .left-menu i{

            margin-right:10px;

        }

        .right-card{

            background:white;

            border:none;

            border-radius:12px;

            box-shadow:0 2px 8px rgba(0,0,0,.06);

        }

    </style>

</head>

<body>
{{end}}
