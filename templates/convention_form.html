{{define "convention_form.html"}}

{{template "admin_layout" .}}

{{end}}

{{define "content"}}

<h2>
{{if .Convention.ID}}
Edit Convention
{{else}}
Add Convention
{{end}}
</h2>

<form method="POST"
      action="{{.Action}}">

    <input
        type="hidden"
        name="id"
        value="{{.Convention.ID}}">

    <label>Year:</label><br>

    <input
        type="number"
        name="year"
        value="{{.Convention.Year}}"
        required>

    <br><br>

    <label>Name:</label><br>

    <input
        type="text"
        name="name"
        value="{{.Convention.Name}}"
        required>

    <br><br>

    <label>Theme:</label><br>

    <input
        type="text"
        name="theme"
        value="{{.Convention.Theme}}">

    <br><br>

    <label>Venue:</label><br>

    <input
        type="text"
        name="venue"
        value="{{.Convention.Venue}}"
        required>

    <br><br>

    <label>Start Date:</label><br>

    <input
        type="date"
        name="start_date"
        value="{{.Convention.StartDate}}"
        required>

    <br><br>

    <label>End Date:</label><br>

    <input
        type="date"
        name="end_date"
        value="{{.Convention.EndDate}}"
        required>

    <br><br>

    <button type="submit">

        {{if .Convention.ID}}
        Update Convention
        {{else}}
        Save Convention
        {{end}}

    </button>

</form>

{{end}}
