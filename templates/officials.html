<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Officials</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Officials</h2>

    <a href="/officials/new" class="btn btn-success mb-3">
        Register New Official
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>Name</th>
                <th>Phone</th>
                <th>Position</th>
                <th>Circuit</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody>

        {{range .Officials}}

        <tr>

            <td>{{.FullName}}</td>

            <td>{{.Phone}}</td>

            <td>{{.Position}}</td>

            <td>{{.Circuit}}</td>

            <td>{{.Status}}</td>

            <td>

                <a href="/officials/view?id={{.ID}}" class="btn btn-sm btn-info">
                    View
                </a>

                <a href="/officials/edit?id={{.ID}}" class="btn btn-sm btn-warning">
                    Edit
                </a>

                <a
                    href="/officials/delete?id={{.ID}}"
                    class="btn btn-sm btn-danger"
                    onclick="return confirm('Delete this official?')">

                    Delete

                </a>

            </td>

        </tr>

        {{end}}

        </tbody>

    </table>

    <a href="/dashboard" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>

</body>

</html>
