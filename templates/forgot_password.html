<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | Apa Diocesan Youth Fellowship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white text-center py-4 rounded-top-4">
                    <div class="rounded-circle bg-white bg-opacity-25 d-inline-flex p-3 mb-2">
                        <i class="bi bi-key-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Forgot Your Password?</h3>
                    <p class="small text-white-50 mb-0">Youth Community Account Recovery</p>
                </div>
                <div class="card-body p-4">
                    <p class="text-secondary small mb-4 text-center">
                        Enter your registered email address and we'll send you a secure link to reset your password.
                    </p>

                    {{if .ErrorMessage}}
                    <div class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                        <div>{{.ErrorMessage}}</div>
                    </div>
                    {{end}}

                    {{if .SuccessMessage}}
                    <div class="alert alert-success d-flex align-items-center gap-2 mb-4" role="alert">
                        <i class="bi bi-check-circle-fill fs-5"></i>
                        <div>{{.SuccessMessage}}</div>
                    </div>
                    {{end}}

                    {{if not .SuccessMessage}}
                    <form method="POST" action="/forgot-password" novalidate>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="recoveryEmail">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input
                                    type="email"
                                    id="recoveryEmail"
                                    name="email"
                                    class="form-control"
                                    placeholder="e.g. member@example.com"
                                    value="{{.Email}}"
                                    required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-pill shadow-sm">
                            <i class="bi bi-send me-1"></i> Send Reset Link
                        </button>
                    </form>
                    {{end}}

                    <hr class="my-4">

                    <div class="text-center">
                        <a href="/community/login" class="text-decoration-none text-success fw-semibold small">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
