<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Community Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">

                    <h2>Community Login</h2>

                </div>

                <div class="card-body">

                    <form method="POST" action="/community/login">

                        <div class="mb-3">

                            <label class="form-label" for="loginUsername">
                                Username
                            </label>

                            <input
                                type="text"
                                id="loginUsername"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0" for="loginPassword">
                                    Password
                                </label>
                                <a href="/forgot-password" class="small text-decoration-none text-success">
                                    Forgot Password?
                                </a>
                            </div>

                            <div class="input-group">
                                <input
                                    type="password"
                                    id="loginPassword"
                                    name="password"
                                    class="form-control"
                                    required>
                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="toggleLoginPassword"
                                    aria-label="Show password"
                                    title="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Login

                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">

                        Don't have an account?

                        <a href="/signup">
                            Create Account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggleLoginPassword');
    const pwdInput = document.getElementById('loginPassword');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function() {
            const icon = this.querySelector('i');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
                this.setAttribute('aria-label', 'Hide password');
                this.setAttribute('title', 'Hide password');
            } else {
                pwdInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
                this.setAttribute('aria-label', 'Show password');
                this.setAttribute('title', 'Show password');
            }
        });
    }
});
</script>

</body>
</html>
