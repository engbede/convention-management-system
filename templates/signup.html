<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Create Community Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="text-center">
                        Create Community Account
                    </h3>

                </div>

                <div class="card-body">

                    <form action="/create-account" method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="full_name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone">

                        </div>

                        <div class="mb-3">

                            <label class="form-label" for="signupPassword">
                                Password
                            </label>

                            <div class="input-group">
                                <input
                                    type="password"
                                    id="signupPassword"
                                    class="form-control"
                                    name="password"
                                    required>
                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="toggleSignupPassword"
                                    aria-label="Show password"
                                    title="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label" for="signupConfirmPassword">
                                Confirm Password
                            </label>

                            <div class="input-group">
                                <input
                                    type="password"
                                    id="signupConfirmPassword"
                                    class="form-control"
                                    name="confirm_password"
                                    required>
                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="toggleSignupConfirmPassword"
                                    aria-label="Show confirm password"
                                    title="Show confirm password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Create Account

                        </button>

                    </form>

                    <hr>

                    <p class="text-center">

                        Already have an account?

                        <a href="/community/login">

                            Login Here

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function setupToggle(buttonId, inputId, defaultLabel, activeLabel) {
        const btn = document.getElementById(buttonId);
        const input = document.getElementById(inputId);
        if (btn && input) {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('bi-eye', 'bi-eye-slash');
                    this.setAttribute('aria-label', activeLabel);
                    this.setAttribute('title', activeLabel);
                } else {
                    input.type = 'password';
                    icon.classList.replace('bi-eye-slash', 'bi-eye');
                    this.setAttribute('aria-label', defaultLabel);
                    this.setAttribute('title', defaultLabel);
                }
            });
        }
    }

    setupToggle('toggleSignupPassword', 'signupPassword', 'Show password', 'Hide password');
    setupToggle('toggleSignupConfirmPassword', 'signupConfirmPassword', 'Show confirm password', 'Hide confirm password');
});
</script>

</body>

</html>
