<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{.Title}}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>{{.Title}}</h3>

</div>

<div class="card-body">

{{if .Error}}

<div class="alert alert-danger">

{{.Error}}

</div>

{{end}}

<form method="POST" action="{{.Action}}">

<div class="mb-3">

<label class="form-label">

Title

</label>

<input
type="text"
class="form-control"
name="title"
value="{{.Notice.Title}}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Message

</label>

<textarea
class="form-control"
rows="6"
name="message"
required>{{.Notice.Message}}</textarea>

</div>

<div class="row">

<div class="col-md-4">

<label class="form-label">

Audience

</label>

<select
class="form-select"
name="audience">

<option value="Everyone">Everyone</option>

<option value="Officials">Officials</option>

<option value="Registrants">Registrants</option>

<option value="Circuit Leaders">Circuit Leaders</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Priority

</label>

<select
class="form-select"
name="priority">

<option value="Low">Low</option>

<option value="Normal" selected>Normal</option>

<option value="High">High</option>

<option value="Emergency">Emergency</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Pin Notice

</label>

<div class="form-check mt-2">

<input
class="form-check-input"
type="checkbox"
name="pinned">

<label class="form-check-label">

Pinned

</label>

</div>

</div>

</div>

<div class="row mt-3">

<div class="col-md-6">

<label>

Start Date

</label>

<input
type="date"
class="form-control"
name="start_date">

</div>

<div class="col-md-6">

<label>

End Date

</label>

<input
type="date"
class="form-control"
name="end_date">

</div>

</div>

<div class="mt-4">

<button
class="btn btn-success">

Save Notice

</button>

<a
href="/dashboard"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

<input
    type="hidden"
    name="id"
    value="{{.Notice.ID}}">
</div>

</div>

</div>

</body>

</html>
