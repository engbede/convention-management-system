<div class="container mt-5">

    <h2>Login</h2>

    <form method="POST" action="/login">

        <div class="mb-3">

            <label>Username</label>

            <input
                class="form-control"
                name="username"
                required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                class="form-control"
                type="password"
                name="password"
                required>

        </div>

        <button class="btn btn-success">

            Login

        </button>

    </form>

</div>
