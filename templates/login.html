<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrator Login — Diocese of Apa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --mcn-navy: #0a2240;
            --mcn-gold: #c59b27;
            --mcn-green: #1b382b;
        }
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 1.5rem;
        }
        .admin-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background: #ffffff;
            width: 100%;
            max-width: 440px;
        }
        .admin-card-header {
            background: linear-gradient(135deg, #1b382b 0%, #0a2240 100%);
            border-bottom: 3px solid var(--mcn-gold);
            padding: 2rem 1.75rem 1.75rem 1.75rem;
            text-align: center;
            color: #ffffff;
        }
        .brand-badge {
            display: inline-block;
            background: rgba(197, 155, 39, 0.2);
            color: #ecd58b;
            border: 1px solid rgba(197, 155, 39, 0.4);
            border-radius: 50rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.75rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }
        .admin-btn {
            background: linear-gradient(135deg, #1b382b 0%, #14241c 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .admin-btn:hover {
            background: linear-gradient(135deg, #244b3a 0%, #1b382b 100%);
            color: #ecd58b;
            box-shadow: 0 4px 12px rgba(27, 56, 43, 0.25);
        }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="admin-card-header">
        <span class="brand-badge">
            <i class="bi bi-shield-lock-fill me-1"></i> Diocesan Administration
        </span>
        <h4 class="fw-bold mb-1">Methodist Church Nigeria</h4>
        <p class="text-white-50 small mb-0">Diocese of Apa • Convention Management</p>
    </div>

    <div class="p-4">
        {{if .Error}}
        <div class="alert alert-danger d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
            <div>{{.Error}}</div>
        </div>
        {{end}}

        {{if .Success}}
        <div class="alert alert-success d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
            <div>{{.Success}}</div>
        </div>
        {{end}}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Administrator username" value="{{.Username}}" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-bold text-secondary mb-0">Password</label>
                    <a href="/admin/forgot-password" class="small text-decoration-none text-muted">Forgot password?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="admin-btn w-100 mt-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Mission Control
            </button>

            <div class="text-center pt-2 border-top">
                <a href="/" class="small text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i> Return to Public Convention Portal
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
