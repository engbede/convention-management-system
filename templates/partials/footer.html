{{define "footer"}}

<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("createPostForm");
    const textarea = document.querySelector("textarea[name='content']");
    const counter = document.getElementById("charCount");
    const imageInput = document.getElementById("imageInput");
    const videoInput = document.getElementById("videoInput");
    const preview = document.getElementById("previewArea");
    const errorAlert = document.getElementById("postErrorAlert");
    const errorText = document.getElementById("postErrorText");
    const progressContainer = document.getElementById("postUploadProgressContainer");
    const progressBar = document.getElementById("postProgressBar");
    const progressStatus = document.getElementById("postProgressStatus");
    const progressPercent = document.getElementById("postProgressPercent");
    const submitBtn = document.getElementById("submitPostBtn");
    const submitSpinner = document.getElementById("submitPostSpinner");
    const submitIcon = document.getElementById("submitPostIcon");
    const submitText = document.getElementById("submitPostText");

    let currentMediaUrl = null;

    function showError(msg) {
        if (errorText && errorAlert) {
            errorText.textContent = msg;
            errorAlert.classList.remove("d-none");
            errorAlert.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } else {
            alert(msg);
        }
    }

    function clearError() {
        if (errorAlert) {
            errorAlert.classList.add("d-none");
        }
    }

    function clearMediaPreview() {
        if (currentMediaUrl) {
            URL.revokeObjectURL(currentMediaUrl);
            currentMediaUrl = null;
        }
        if (preview) {
            preview.innerHTML = "";
        }
        if (imageInput) imageInput.value = "";
        if (videoInput) videoInput.value = "";
    }

    function setSubmittingState(isSubmitting, statusMsg) {
        if (submitBtn) {
            submitBtn.disabled = isSubmitting;
        }
        if (submitSpinner) {
            if (isSubmitting) {
                submitSpinner.classList.remove("d-none");
            } else {
                submitSpinner.classList.add("d-none");
            }
        }
        if (submitIcon) {
            if (isSubmitting) {
                submitIcon.classList.add("d-none");
            } else {
                submitIcon.classList.remove("d-none");
            }
        }
        if (submitText) {
            submitText.textContent = isSubmitting ? (statusMsg || "Processing...") : "Post";
        }
        if (progressContainer) {
            if (isSubmitting) {
                progressContainer.classList.remove("d-none");
            } else {
                progressContainer.classList.add("d-none");
            }
        }
        if (!isSubmitting && progressBar) {
            progressBar.style.width = "0%";
            progressBar.setAttribute("aria-valuenow", "0");
            if (progressPercent) progressPercent.textContent = "0%";
        }
    }

    if (textarea && counter) {
        textarea.addEventListener("input", function () {
            counter.textContent = textarea.value.length + " / 3000";
        });
    }

    if (imageInput) {
        imageInput.addEventListener("change", function () {
            clearError();
            if (currentMediaUrl) {
                URL.revokeObjectURL(currentMediaUrl);
                currentMediaUrl = null;
            }
            if (preview) preview.innerHTML = "";

            const file = this.files[0];
            if (!file) return;

            // Clear video selection if image is selected
            if (videoInput) videoInput.value = "";

            if (file.size > 5 * 1024 * 1024) {
                showError("Image size must not exceed 5 MB.");
                this.value = "";
                return;
            }

            currentMediaUrl = URL.createObjectURL(file);

            const container = document.createElement("div");
            container.className = "position-relative d-inline-block w-100 text-center";

            const img = document.createElement("img");
            img.src = currentMediaUrl;
            img.className = "img-fluid rounded-4 shadow-sm";
            img.style.maxHeight = "400px";

            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle shadow";
            removeBtn.innerHTML = "✕";
            removeBtn.title = "Remove photo";
            removeBtn.addEventListener("click", function() {
                clearMediaPreview();
            });

            container.appendChild(img);
            container.appendChild(removeBtn);
            preview.appendChild(container);
        });
    }

    if (videoInput) {
        videoInput.addEventListener("change", function () {
            clearError();
            if (currentMediaUrl) {
                URL.revokeObjectURL(currentMediaUrl);
                currentMediaUrl = null;
            }
            if (preview) preview.innerHTML = "";

            const file = this.files[0];
            if (!file) return;

            // Clear image selection if video is selected
            if (imageInput) imageInput.value = "";

            if (file.size > 50 * 1024 * 1024) {
                showError("Video size must not exceed 50 MB.");
                this.value = "";
                return;
            }

            currentMediaUrl = URL.createObjectURL(file);

            const container = document.createElement("div");
            container.className = "position-relative d-inline-block w-100 text-center";

            const video = document.createElement("video");
            video.src = currentMediaUrl;
            video.controls = true;
            video.playsInline = true;
            video.className = "img-fluid rounded-4 shadow-sm";
            video.style.maxHeight = "400px";

            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle shadow";
            removeBtn.innerHTML = "✕";
            removeBtn.title = "Remove video";
            removeBtn.addEventListener("click", function() {
                clearMediaPreview();
            });

            container.appendChild(video);
            container.appendChild(removeBtn);
            preview.appendChild(container);
        });
    }

    if (form) {
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            clearError();

            const content = textarea ? textarea.value.trim() : "";
            const hasImage = imageInput && imageInput.files && imageInput.files.length > 0;
            const hasVideo = videoInput && videoInput.files && videoInput.files.length > 0;

            if (!content && !hasImage && !hasVideo) {
                showError("Please enter some text or select a photo/video before posting.");
                return;
            }

            if (hasVideo && videoInput.files[0].size > 50 * 1024 * 1024) {
                showError("Selected video exceeds the 50 MB size limit.");
                return;
            }

            if (hasImage && imageInput.files[0].size > 5 * 1024 * 1024) {
                showError("Selected image exceeds the 5 MB size limit.");
                return;
            }

            setSubmittingState(true, hasVideo ? "Uploading video..." : "Posting...");

            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();
            xhr.open("POST", form.action || "/community/post", true);
            xhr.setRequestHeader("Accept", "application/json");
            xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");
            xhr.timeout = 120000; // 2 minute bounded timeout

            if (xhr.upload) {
                xhr.upload.onprogress = function (event) {
                    if (event.lengthComputable && event.total > 0) {
                        const pct = Math.min(100, Math.round((event.loaded / event.total) * 100));
                        if (progressBar) {
                            progressBar.style.width = pct + "%";
                            progressBar.setAttribute("aria-valuenow", pct);
                        }
                        if (progressPercent) {
                            progressPercent.textContent = pct + "%";
                        }
                        if (progressStatus) {
                            if (pct < 100) {
                                progressStatus.textContent = `Uploading media (${pct}%)...`;
                            } else {
                                progressStatus.textContent = "Processing and finalizing publication...";
                                if (submitText) submitText.textContent = "Processing...";
                            }
                        }
                    }
                };
            }

            xhr.onload = function () {
                setSubmittingState(false);
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data && data.success) {
                            clearMediaPreview();
                            if (textarea) textarea.value = "";
                            if (counter) counter.textContent = "0 / 3000";
                            window.location.href = data.redirect || "/community";
                            return;
                        }
                    } catch (parseErr) {
                        // Successful response without JSON
                        window.location.href = "/community";
                        return;
                    }
                    window.location.href = "/community";
                } else {
                    let errMsg = "Failed to publish post. Please try again.";
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data && data.error) {
                            errMsg = data.error;
                        }
                    } catch (e) {
                        if (xhr.statusText) {
                            errMsg = `Server error (${xhr.status}): ${xhr.statusText}`;
                        }
                    }
                    showError(errMsg);
                }
            };

            xhr.onerror = function () {
                setSubmittingState(false);
                showError("Network connection error during upload. Please check your network and try again.");
            };

            xhr.ontimeout = function () {
                setSubmittingState(false);
                showError("Upload timed out after 2 minutes. Please verify your connection or try a smaller video.");
            };

            xhr.onabort = function () {
                setSubmittingState(false);
                showError("Upload was cancelled.");
            };

            xhr.send(formData);
        });
    }

});

</script>

</body>

</html>

{{end}}
