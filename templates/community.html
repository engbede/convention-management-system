{{template "header" .}}

<div class="container mt-4">

    <div class="row">

        <div class="col-md-8 mx-auto">

            <div class="card mb-3">

                <div class="card-header">

                    <h3>Youth Community</h3>

                </div>

                <div class="card-body">

                    <form action="/community/post" method="POST">

                        <textarea
                            class="form-control"
                            name="content"
                            rows="4"
                            placeholder="Share something with the community..."
                            required></textarea>

                        <br>

                        <button class="btn btn-primary">

                            Post

                        </button>

                    </form>

                </div>

            </div>

            {{range .Posts}}

            <div class="card mb-3">

                <div class="card-body">

                    <h5>

                        {{.User.FullName}}

                    </h5>

                    <small class="text-muted">

                        @{{.User.Username}}

                    </small>

                    <hr>

                    <p>

                        {{.Content}}

                    </p>

                    <small>

                        {{.CreatedAt}}

                    </small>

                </div>

            </div>

            {{else}}

            <div class="alert alert-info">

                No posts yet.

            </div>

            {{end}}

        </div>

    </div>

</div>
