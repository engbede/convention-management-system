<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | Apa Diocesan Youth Fellowship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white text-center py-4 rounded-top-4">
                    <div class="rounded-circle bg-white bg-opacity-25 d-inline-flex p-3 mb-2">
                        <i class="bi bi-shield-lock fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Reset Your Password</h3>
                    <p class="small text-white-50 mb-0">Create a new, secure password</p>
                </div>
                <div class="card-body p-4">
                    {{if .ErrorMessage}}
                    <div class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                        <div>{{.ErrorMessage}}</div>
                    </div>
                    {{end}}

                    {{if .SuccessMessage}}
                    <div class="alert alert-success d-flex align-items-center gap-2 mb-4" role="alert">
                        <i class="bi bi-check-circle-fill fs-5"></i>
                        <div>{{.SuccessMessage}}</div>
                    </div>
                    <div class="text-center mt-4">
                        <a href="/community/login" class="btn btn-success rounded-pill px-4 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Proceed to Login
                        </a>
                    </div>
                    {{else if .IsValidToken}}
                    <form method="POST" action="/reset-password">
                        <input type="hidden" name="token" value="{{.Token}}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="newPassword">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input
                                    type="password"
                                    id="newPassword"
                                    name="password"
                                    class="form-control"
                                    placeholder="At least 6 characters"
                                    required>
                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="toggleNewPassword"
                                    aria-label="Show password"
                                    title="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="confirmNewPassword">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                <input
                                    type="password"
                                    id="confirmNewPassword"
                                    name="confirm_password"
                                    class="form-control"
                                    placeholder="Re-enter new password"
                                    required>
                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="toggleConfirmNewPassword"
                                    aria-label="Show confirm password"
                                    title="Show confirm password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-pill shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Reset Password
                        </button>
                    </form>
                    {{else}}
                    <div class="text-center py-3">
                        <a href="/forgot-password" class="btn btn-outline-success rounded-pill px-4 py-2 fw-semibold">
                            Request New Reset Link
                        </a>
                    </div>
                    {{end}}

                    <hr class="my-4">

                    <div class="text-center">
                        <a href="/community/login" class="text-decoration-none text-success fw-semibold small">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function setupToggle(buttonId, inputId, defaultLabel, activeLabel) {
        const btn = document.getElementById(buttonId);
        const input = document.getElementById(inputId);
        if (btn && input) {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('bi-eye', 'bi-eye-slash');
                    this.setAttribute('aria-label', activeLabel);
                    this.setAttribute('title', activeLabel);
                } else {
                    input.type = 'password';
                    icon.classList.replace('bi-eye-slash', 'bi-eye');
                    this.setAttribute('aria-label', defaultLabel);
                    this.setAttribute('title', defaultLabel);
                }
            });
        }
    }

    setupToggle('toggleNewPassword', 'newPassword', 'Show password', 'Hide password');
    setupToggle('toggleConfirmNewPassword', 'confirmNewPassword', 'Show confirm password', 'Hide confirm password');
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
