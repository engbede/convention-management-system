{{define "avatar"}}

<div class="avatar-wrapper">

    {{if .ProfilePhoto}}

    <img
        src="{{.ProfilePhotoURL}}"
        class="rounded-circle border border-4 border-white avatar-image"
        onerror="this.onerror=null; this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.classList.remove('d-none');">

    <div
        class="rounded-circle bg-success text-white border border-4 border-white d-none justify-content-center align-items-center avatar-image fw-bold">

        {{.Initials}}

    </div>

    {{else}}

    <div
        class="rounded-circle bg-success text-white border border-4 border-white d-flex justify-content-center align-items-center avatar-image fw-bold">

        {{.Initials}}

    </div>

    {{end}}

</div>

{{end}}
