<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{.Title}}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h3>System Settings</h3>

</div>

<div class="card-body">

<form method="POST" action="/settings">

<h5 class="mb-3">General Information</h5>

<div class="mb-3">

<label class="form-label">Church Name</label>

<input
type="text"
class="form-control"
name="church_name"
value="{{.ChurchName}}">

</div>

<div class="mb-3">

<label class="form-label">Diocese Name</label>

<input
type="text"
class="form-control"
name="diocese_name"
value="{{.DioceseName}}">

</div>

<div class="mb-3">

<label class="form-label">Convention Name</label>

<input
type="text"
class="form-control"
name="convention_name"
value="{{.ConventionName}}">

</div>

<hr>

<h5 class="mb-3">Contact Information</h5>

<div class="mb-3">

<label class="form-label">Contact Email</label>

<input
type="email"
class="form-control"
name="contact_email"
value="{{.ContactEmail}}">

</div>

<div class="mb-3">

<label class="form-label">Contact Phone</label>

<input
type="text"
class="form-control"
name="contact_phone"
value="{{.ContactPhone}}">

</div>

<hr>

<h5 class="mb-3">Registration</h5>

<div class="mb-3">

<label class="form-label">

Registration Status

</label>

<select
class="form-select"
name="registration_open">

<option value="open" {{if eq .RegistrationOpen "open"}}selected{{end}}>
Open
</option>

<option value="closed" {{if eq .RegistrationOpen "closed"}}selected{{end}}>
Closed
</option>

</select>

</div>

<div class="mt-4">

<button class="btn btn-success">

Save Settings

</button>

<a
href="/dashboard"
class="btn btn-secondary">

Back

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
