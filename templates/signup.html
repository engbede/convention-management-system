<form action="/create-account" method="POST">

    <div class="mb-3">
        <label>Full Name</label>
        <input
            class="form-control"
            name="full_name"
            required>
    </div>

    <div class="mb-3">
        <label>Username</label>
        <input
            class="form-control"
            name="username"
            required>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input
            class="form-control"
            name="email"
            type="email">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input
            class="form-control"
            name="phone">
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input
            class="form-control"
            type="password"
            name="password"
            required>
    </div>

    <div class="mb-3">
        <label>Confirm Password</label>
        <input
            class="form-control"
            type="password"
            name="confirm_password"
            required>
    </div>

    <button
        class="btn btn-primary"
        type="submit">

        Create Account

    </button>

</form>
