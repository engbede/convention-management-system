<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Official Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>{{.FullName}}</h3>

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>
<th width="30%">Gender</th>
<td>{{.Gender}}</td>
</tr>

<tr>
<th>Phone</th>
<td>{{.Phone}}</td>
</tr>

<tr>
<th>Email</th>
<td>{{.Email}}</td>
</tr>

<tr>
<th>Circuit</th>
<td>{{.Circuit}}</td>
</tr>

<tr>
<th>Local Church</th>
<td>{{.LocalChurch}}</td>
</tr>

<tr>
<th>Position</th>
<td>{{.Position}}</td>
</tr>

<tr>
<th>Department</th>
<td>{{.Department}}</td>
</tr>

<tr>
<th>Status</th>
<td>{{.Status}}</td>
</tr>

</table>

<a href="/officials/edit?id={{.ID}}" class="btn btn-warning">

Edit

</a>

<a href="/officials" class="btn btn-secondary">

Back

</a>

</div>

</div>

</div>

</body>

</html>
