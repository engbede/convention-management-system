<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{.Title}}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>{{.Title}}</h3>

</div>

<div class="card-body">

{{if .Error}}

<div class="alert alert-danger">

{{.Error}}

</div>

{{end}}

<form method="POST" action="{{.Action}}">

    <input
        type="hidden"
        name="id"
        value="{{.Notice.ID}}">

<div class="mb-3">

<label class="form-label">

Title

</label>

<input
type="text"
class="form-control"
name="title"
value="{{.Notice.Title}}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Message

</label>

<textarea
class="form-control"
rows="6"
name="message"
required>{{.Notice.Message}}</textarea>

</div>

<div class="row">

<div class="col-md-4">

<label class="form-label">

Audience

</label>

<select
class="form-select"
name="audience">

<option value="Everyone" {{if eq .Notice.Audience "Everyone"}}selected{{end}}>Everyone</option>

<option value="Officials" {{if eq .Notice.Audience "Officials"}}selected{{end}}>Officials</option>

<option value="Registrants" {{if eq .Notice.Audience "Registrants"}}selected{{end}}>Registrants</option>

<option value="Circuit Leaders" {{if eq .Notice.Audience "Circuit Leaders"}}selected{{end}}>Circuit Leaders</option>
</select>

</div>

<div class="col-md-4">

<label class="form-label">

Priority

</label>

<select
class="form-select"
name="priority">

<option value="Low" {{if eq .Notice.Priority "Low"}}selected{{end}}>Low</option>

<option value="Normal" {{if eq .Notice.Priority "Normal"}}selected{{end}}>Normal</option>

<option value="High" {{if eq .Notice.Priority "High"}}selected{{end}}>High</option>

<option value="Emergency" {{if eq .Notice.Priority "Emergency"}}selected{{end}}>Emergency</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Pin Notice

</label>

<div class="form-check mt-2">

<input
class="form-check-input"
type="checkbox"
name="pinned"
{{if .Notice.Pinned}}checked{{end}}>

<label class="form-check-label">

Pinned

</label>

</div>

</div>

</div>

<div class="row mt-3">

<div class="col-md-6">

<label>

Start Date

</label>

<input
type="date"
class="form-control"
name="start_date"
value="{{.Notice.StartDate}}">

</div>

<div class="col-md-6">

<label>

End Date

</label>

<input
type="date"
class="form-control"
name="end_date"
value="{{.Notice.EndDate}}">

</div>

</div>

<div class="mt-4">

<button
class="btn btn-success">

Save Notice

</button>

<a
href="/dashboard"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
