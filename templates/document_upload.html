<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Attach File</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Attach File</h3>

</div>

<div class="card-body">

<h5>{{.Title}}</h5>

<p>

<strong>Category:</strong>

{{.Category}}

</p>

<form
method="POST"
action="/documents/upload"
enctype="multipart/form-data">

<input
type="hidden"
name="document_id"
value="{{.ID}}">

<div class="mb-3">

<input
type="file"
name="file"
class="form-control"
required>

</div>

<button
class="btn btn-success">

Upload File

</button>

<a
href="/documents"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
