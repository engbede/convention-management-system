<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{.Title}}</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>{{.Title}}</h3>

</div>

<div class="card-body">

<form method="POST" action="{{.Action}}">

<input
type="hidden"
name="id"
value="{{.Document.ID}}">

<div class="mb-3">

<label>Title</label>

<input
class="form-control"
name="title"
value="{{.Document.Title}}"
required>

</div>

<div class="mb-3">

<label>Category</label>

<select
class="form-select"
name="category">

<option value="Convention Programme">Convention Programme</option>

<option value="Agenda">Agenda</option>

<option value="Minutes">Minutes</option>

<option value="Committee Report">Committee Report</option>

<option value="Financial Report">Financial Report</option>

<option value="Attendance Report">Attendance Report</option>

<option value="Resolution">Resolution</option>

<option value="Circular">Circular</option>

<option value="Pastor's Charge">Pastor's Charge</option>

<option value="Speech">Speech</option>

<option value="General Document">General Document</option>

</select>

</div>

<div class="mb-3">

<label>Convention</label>

<input
class="form-control"
name="convention"
value="{{.Document.Convention}}">

</div>

<div class="mb-3">

<label>Year</label>

<input
type="number"
class="form-control"
name="year"
value="{{.Document.Year}}">

</div>

<div class="mb-3">

<label>Description</label>

<textarea
class="form-control"
rows="3"
name="description">{{.Document.Description}}</textarea>

</div>

<div class="mb-3">

<label>Document Content</label>

<textarea
class="form-control"
rows="15"
name="content"
required>{{.Document.Content}}</textarea>

</div>

<button class="btn btn-success">

Save Document

</button>

<a
href="/documents"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
