<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set New Administrator Password — Diocese of Apa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --mcn-navy: #0a2240;
            --mcn-gold: #c59b27;
            --mcn-green: #1b382b;
        }
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 1.5rem;
        }
        .admin-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background: #ffffff;
            width: 100%;
            max-width: 440px;
        }
        .admin-card-header {
            background: linear-gradient(135deg, #1b382b 0%, #0a2240 100%);
            border-bottom: 3px solid var(--mcn-gold);
            padding: 2rem 1.75rem 1.75rem 1.75rem;
            text-align: center;
            color: #ffffff;
        }
        .admin-btn {
            background: linear-gradient(135deg, #1b382b 0%, #14241c 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .admin-btn:hover {
            background: linear-gradient(135deg, #244b3a 0%, #1b382b 100%);
            color: #ecd58b;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="admin-card-header">
        <h4 class="fw-bold mb-1">Set New Password</h4>
        <p class="text-white-50 small mb-0">Diocesan Administrator Account</p>
    </div>

    <div class="p-4">
        {{if .ErrorMessage}}
        <div class="alert alert-danger d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
            <div>{{.ErrorMessage}}</div>
        </div>
        {{end}}

        {{if .SuccessMessage}}
        <div class="alert alert-success d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
            <div>{{.SuccessMessage}}</div>
        </div>
        <div class="text-center mt-3">
            <a href="/login" class="admin-btn d-inline-block text-decoration-none">
                <i class="bi bi-box-arrow-in-right me-1"></i> Proceed to Login
            </a>
        </div>
        {{else if .IsValidToken}}
        <form method="POST" action="/admin/reset-password">
            <input type="hidden" name="token" value="{{.Token}}">

            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Minimum 8 characters" required minlength="8" autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-shield-lock"></i>
                    </span>
                    <input type="password" name="confirm_password" class="form-control border-start-0 ps-0" placeholder="Re-enter password" required minlength="8">
                </div>
            </div>

            <button type="submit" class="admin-btn w-100 mt-2 mb-3">
                <i class="bi bi-check2-circle me-1"></i> Update Password
            </button>
        </form>
        {{else}}
        <div class="text-center pt-2">
            <a href="/admin/forgot-password" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-repeat me-1"></i> Request a New Reset Link
            </a>
        </div>
        {{end}}

        <div class="text-center pt-3 border-top mt-3">
            <a href="/login" class="small text-decoration-none text-muted">
                <i class="bi bi-arrow-left me-1"></i> Back to Administrator Login
            </a>
        </div>
    </div>
</div>

</body>
</html>
