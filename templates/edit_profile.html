{{template "header" .}}
{{template "navbar" .}}

<div class="container mt-5 mb-5" style="max-width:1000px;">

    <form action="/profile/edit" method="POST">

        <!-- BASIC INFORMATION -->

        <div class="card shadow-sm border-0 rounded-4 mb-4">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Basic Information</h4>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Full Name</label>

                        <input
                            class="form-control"
                            name="full_name"
                            value="{{.User.FullName}}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Username</label>

                        <input
                            class="form-control"
                            value="{{.User.Username}}"
                            readonly>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">Bio</label>

                    <textarea
                        class="form-control"
                        rows="4"
                        name="bio">{{.User.Bio}}</textarea>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Gender</label>

                        <select class="form-select" name="gender">

                            <option value="">Select</option>

                            <option value="Male" {{if eq .User.Gender "Male"}}selected{{end}}>Male</option>

                            <option value="Female" {{if eq .User.Gender "Female"}}selected{{end}}>Female</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Birth Date</label>

                        <input
                            type="date"
                            class="form-control"
                            name="birth_date"
                            value="{{.User.BirthDate}}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Occupation</label>

                        <input
                            class="form-control"
                            name="occupation"
                            value="{{.User.Occupation}}">

                    </div>

                </div>

            </div>

        </div>

        <!-- LOCATION -->

        <div class="card shadow-sm border-0 rounded-4 mb-4">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Location</h4>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 mb-3">

                        <label>Country</label>

                        <input
                            class="form-control"
                            name="country"
                            value="{{.User.Country}}">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label>State</label>

                        <input
                            class="form-control"
                            name="state"
                            value="{{.User.State}}">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label>Location</label>

                        <input
                            class="form-control"
                            name="location"
                            value="{{.User.Location}}">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label>Website</label>

                        <input
                            class="form-control"
                            name="website"
                            value="{{.User.Website}}">

                    </div>

                </div>

            </div>

        </div>

        <!-- CHURCH INFORMATION -->

        <div class="card shadow-sm border-0 rounded-4 mb-4">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Church Information</h4>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Church Name</label>

                        <input
                            class="form-control"
                            name="church_name"
                            value="{{.User.ChurchName}}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Circuit</label>

                        <input
                            class="form-control"
                            name="circuit"
                            value="{{.User.Circuit}}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Local Church</label>

                        <input
                            class="form-control"
                            name="local_church"
                            value="{{.User.LocalChurch}}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Department</label>

                        <input
                            class="form-control"
                            name="department"
                            value="{{.User.Department}}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Position</label>

                        <input
                            class="form-control"
                            name="position"
                            value="{{.User.Position}}">

                    </div>

                </div>

            </div>

        </div>

        <!-- FAITH JOURNEY -->

        <div class="card shadow-sm border-0 rounded-4 mb-4">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Faith Journey</h4>
            </div>

            <div class="card-body">

                <div class="mb-3">

                    <label>Favorite Bible Verse</label>

                    <input
                        class="form-control"
                        name="favorite_bible_verse"
                        value="{{.User.FavoriteBibleVerse}}">

                </div>

                <div class="mb-3">

                    <label>Life Verse</label>

                    <input
                        class="form-control"
                        name="life_verse"
                        value="{{.User.LifeVerse}}">

                </div>

                <div class="mb-3">

                    <label>Calling</label>

                    <input
                        class="form-control"
                        name="calling"
                        value="{{.User.Calling}}">

                </div>

                <div class="mb-3">

                    <label>Spiritual Gifts</label>

                    <input
                        class="form-control"
                        name="spiritual_gifts"
                        value="{{.User.SpiritualGifts}}">

                </div>

                <div class="mb-3">

                    <label>Salvation Testimony</label>

                    <textarea
                        class="form-control"
                        rows="5"
                        name="salvation_testimony">{{.User.SalvationTestimony}}</textarea>

                </div>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="water_baptized"
                        {{if .User.WaterBaptized}}checked{{end}}>

                    <label class="form-check-label">
                        Water Baptized
                    </label>

                </div>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="holy_spirit_baptized"
                        {{if .User.HolySpiritBaptized}}checked{{end}}>

                    <label class="form-check-label">
                        Holy Spirit Baptized
                    </label>

                </div>

            </div>

        </div>

        <!-- INTERESTS -->

        <div class="card shadow-sm border-0 rounded-4 mb-4">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Christian Interests</h4>
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label>Favorite Preacher</label>
                    <input class="form-control" name="favorite_preacher" value="{{.User.FavoritePreacher}}">
                </div>

                <div class="mb-3">
                    <label>Favorite Christian Book</label>
                    <input class="form-control" name="favorite_christian_book" value="{{.User.FavoriteChristianBook}}">
                </div>

                <div class="mb-3">
                    <label>Favorite Worship Song</label>
                    <input class="form-control" name="favorite_worship_song" value="{{.User.FavoriteWorshipSong}}">
                </div>

                <div class="mb-3">
                    <label>Favorite Gospel Artist</label>
                    <input class="form-control" name="favorite_gospel_artist" value="{{.User.FavoriteGospelArtist}}">
                </div>

            </div>

        </div>

        <!-- PERSONAL -->

        <div class="card shadow-sm border-0 rounded-4 mb-4">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Personal</h4>
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label>Skills</label>
                    <input class="form-control" name="skills" value="{{.User.Skills}}">
                </div>

                <div class="mb-3">
                    <label>Languages</label>
                    <input class="form-control" name="languages" value="{{.User.Languages}}">
                </div>

                <div class="mb-3">
                    <label>Hobbies</label>
                    <input class="form-control" name="hobbies" value="{{.User.Hobbies}}">
                </div>

            </div>

        </div>

        <!-- MISSION -->

        <div class="card shadow-sm border-0 rounded-4 mb-4">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Mission & Vision</h4>
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label>Mission</label>
                    <textarea class="form-control" rows="3" name="mission">{{.User.Mission}}</textarea>
                </div>

                <div class="mb-3">
                    <label>Vision</label>
                    <textarea class="form-control" rows="3" name="vision">{{.User.Vision}}</textarea>
                </div>

                <div class="mb-3">
                    <label>Favorite Quote</label>
                    <textarea class="form-control" rows="2" name="favorite_quote">{{.User.FavoriteQuote}}</textarea>
                </div>

            </div>

        </div>

        <div class="text-end">

            <a href="/profile" class="btn btn-secondary">
                Cancel
            </a>

            <button class="btn btn-success">
                Save Changes
            </button>

        </div>

    </form>

</div>

{{template "footer" .}}
